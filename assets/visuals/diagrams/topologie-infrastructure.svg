<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="top-title top-desc"><title id="top-title">Infrastructure personnelle IA</title><desc id="top-desc">Quatre roles materiels connectes via un reseau prive : PC Windows, serveur distant, smartphone Linux recycle, NAS Debian. Ce sont des liaisons logiques, pas des routes d'application.</desc><rect width="1200" height="900" fill="#f9faf8"/><text x="95" y="83.38" font-family="Arial,Helvetica,sans-serif" fill="#1e1e1e" font-weight="600" font-size="33" text-anchor="start"><tspan x="95" dy="0">L'infrastructure personnelle de mes projets IA</tspan></text><text x="95" y="125.2" font-family="Arial,Helvetica,sans-serif" fill="#5c6267" font-weight="600" font-size="20" text-anchor="start"><tspan x="95" dy="0">Vue publique des roles. Les liens ne sont pas des routes reelles.</tspan></text><rect x="70" y="210" width="370" height="145" rx="14" fill="#a5d8ff" stroke="#4a9eed" stroke-width="3"/><rect x="760" y="210" width="370" height="145" rx="14" fill="#d0bfff" stroke="#8b5cf6" stroke-width="3"/><rect x="435" y="423" width="330" height="125" rx="14" fill="#fff3bf" stroke="#f59e0b" stroke-width="3"/><polyline points="310,355 495,423" fill="none" stroke="#5d6973" stroke-width="3.5" stroke-linecap="round" /><polyline points="885,355 705,423" fill="none" stroke="#5d6973" stroke-width="3.5" stroke-linecap="round" /><rect x="70" y="650" width="370" height="145" rx="14" fill="#b2f2bb" stroke="#22c55e" stroke-width="3"/><polyline points="310,650 495,548" fill="none" stroke="#5d6973" stroke-width="3.5" stroke-linecap="round" /><rect x="760" y="650" width="370" height="145" rx="14" fill="#c3fae8" stroke="#06b6d4" stroke-width="3"/><polyline points="885,650 705,548" fill="none" stroke="#5d6973" stroke-width="3.5" stroke-linecap="round" /><text x="255" y="276.38" font-family="Arial,Helvetica,sans-serif" fill="#151d26" font-weight="650" font-size="24" text-anchor="middle"><tspan x="255" dy="0">PC Windows</tspan><tspan x="255" dy="29.52">Runner et developpement</tspan></text><text x="945" y="276.38" font-family="Arial,Helvetica,sans-serif" fill="#151d26" font-weight="650" font-size="24" text-anchor="middle"><tspan x="945" dy="0">Serveur distant</tspan><tspan x="945" dy="29.52">MCP et services RAG</tspan></text><text x="600" y="479.38" font-family="Arial,Helvetica,sans-serif" fill="#151d26" font-weight="650" font-size="24" text-anchor="middle"><tspan x="600" dy="0">Reseau prive NetBird</tspan><tspan x="600" dy="29.52">Acces autorises</tspan></text><text x="255" y="716.635" font-family="Arial,Helvetica,sans-serif" fill="#151d26" font-weight="650" font-size="23" text-anchor="middle"><tspan x="255" dy="0">Smartphone recycle</tspan><tspan x="255" dy="28.29">Ubuntu ARM64, noeud agents</tspan></text><text x="945" y="716.635" font-family="Arial,Helvetica,sans-serif" fill="#151d26" font-weight="650" font-size="23" text-anchor="middle"><tspan x="945" dy="0">NAS Debian maison</tspan><tspan x="945" dy="28.29">Nextcloud et sauvegardes</tspan></text></svg>
