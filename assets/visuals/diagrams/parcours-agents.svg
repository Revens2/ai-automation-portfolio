<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Orchestration et validation de missions IA</title><desc id="desc">AI mission orchestration and verification</desc><defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 z" fill="#3a4b5b"/></marker></defs><rect width="1200" height="900" fill="#f9faf8"/><g><text x="80" y="94.24" fill="#1e1e1e" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600"><tspan x="80" dy="0">Une mission IA, de la demande au controle</tspan></text><text x="80" y="137.34" fill="#63666a" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600"><tspan x="80" dy="0">Un statut de processus ne suffit pas a valider un objectif.</tspan></text><rect x="90" y="235" width="225" height="125" rx="14" fill="#a5d8ff" stroke="undefined" stroke-width="3"/><polyline points="315,297 370,297" fill="none" stroke="undefined" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="370" y="235" width="250" height="125" rx="14" fill="#d0bfff" stroke="undefined" stroke-width="3"/><polyline points="620,297 675,297" fill="none" stroke="undefined" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="675" y="235" width="230" height="125" rx="14" fill="#c3fae8" stroke="undefined" stroke-width="3"/><polyline points="905,297 960,297" fill="none" stroke="undefined" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="960" y="235" width="170" height="125" rx="14" fill="#b2f2bb" stroke="undefined" stroke-width="3"/><rect x="425" y="540" width="350" height="135" rx="14" fill="#fff3bf" stroke="undefined" stroke-width="3"/><polyline points="1045,360 1045,608 775,608" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="130" y="782.36" fill="#b45309" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600"><tspan x="130" dy="0">Execution constatee     ≠     resultat prouve</tspan></text><text x="202.5" y="291.635" fill="#151d26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650"><tspan x="202.5" dy="0">Client IA</tspan><tspan x="202.5" dy="28.29">Demande une action</tspan></text><text x="495" y="291.635" fill="#151d26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650"><tspan x="495" dy="0">Gateway MCP</tspan><tspan x="495" dy="28.29">Broker et permissions</tspan></text><text x="790" y="291.635" fill="#151d26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650"><tspan x="790" dy="0">Runner autorise</tspan><tspan x="790" dy="28.29">Agent de code</tspan></text><text x="1045" y="292.145" fill="#151d26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="1045" dy="0">Etat du job</tspan><tspan x="1045" dy="25.83">Trace et sortie</tspan></text><text x="600" y="601.38" fill="#151d26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650"><tspan x="600" dy="0">Validation separee</tspan><tspan x="600" dy="29.52">Objectif vraiment atteint ?</tspan></text></g></svg>
