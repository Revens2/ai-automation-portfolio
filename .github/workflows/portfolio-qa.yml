name: Portfolio QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site structure and privacy
        run: python scripts/qa_portfolio.py
      - name: Install Chromium for browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check rendered pages at desktop and mobile sizes
        run: python scripts/qa_visual.py
      - name: Retain visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
