name: Portfolio QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site structure and privacy
        run: python scripts/qa_portfolio.py
      - name: Install browser automation dependencies
        run: |
          python -m pip install playwright
          if command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null; then
            echo "Using preinstalled Google Chrome on GitHub runner"
          else
            echo "Chrome is not preinstalled; downloading Chromium from Azure Edge"
            PLAYWRIGHT_DOWNLOAD_HOST=https://playwright.azureedge.net python -m playwright install --with-deps chromium
          fi
      - name: Check rendered pages at desktop and mobile sizes
        run: python scripts/qa_visual.py
      - name: Retain visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7